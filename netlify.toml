[build]
  command = "npm run build:netlify"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "24"
  AWS_LAMBDA_JS_RUNTIME = "nodejs24.x"
[functions]
  node_bundler = "esbuild"
  included_files = ["data/netlify-catalog/catalog.sqlite"]
[[redirects]]
  from = "/api/source-data/*"
  to = "/source-data/:splat"
  status = 200
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
[[redirects]]
  from = "/account"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
