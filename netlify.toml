[build]
  command = "npm run build:netlify"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "24"
  AWS_LAMBDA_JS_RUNTIME = "nodejs24.x"
[functions]
  node_bundler = "esbuild"
  included_files = ["data/netlify-catalog/catalog.sqlite"]
[[redirects]]
  from = "/api/source-data/*"
  to = "/source-data/:splat"
  status = 200
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
[[redirects]]
  from = "/account"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=()"
    Strict-Transport-Security = "max-age=31536000"
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Cache immutable Vite bundles for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts for 1 year
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images for 30 days
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Cache static discovery datasets with stale-while-revalidate
[[headers]]
  for = "/discovery/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
