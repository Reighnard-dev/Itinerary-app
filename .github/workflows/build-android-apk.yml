name: Build GMS-Free Android & Huawei APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Deployed Vercel URL for Roam"
        required: true
        default: "https://roam-itinerary.vercel.app"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Copy app launcher icon
        run: |
          mkdir -p mobile/android/app/src/main/res/mipmap-xxxhdpi
          cp public/icons/icon-192.png mobile/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build universal GMS-free APK
        working-directory: mobile/android
        env:
          ROAM_APP_URL: ${{ github.event.inputs.app_url || vars.ROAM_APP_URL || 'https://roam-itinerary.vercel.app' }}
        run: |
          gradle assembleRelease -PROAM_APP_URL="$ROAM_APP_URL"
          cp app/build/outputs/apk/release/app-release.apk ../../roam-android.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: roam-android-apk
          path: roam-android.apk

      - name: Attach APK to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: roam-android.apk
