      const tl = gsap.timeline({ paused: true });

      const statsProgress = { p: 0 };

      // 0.00 - 2.40s: Continuous calm 35mm dolly on golden-hour landscape

        { scale: 1.00, x: 10, duration: 2.40, ease: 'power1.out' },

        { opacity: 0, scale: 0.45, y: 40, rotation: -6 },
        { opacity: 1, scale: 1, y: 0, rotation: 0, duration: 0.48, ease: 'back.out(1.4)' },
        0.10
      );

      // Multi-plane parallax entry of frosted cards
      tl.fromTo(
        '#s6-card-left',
        { opacity: 0, x: -140, y: 30, scale: 0.88 },
