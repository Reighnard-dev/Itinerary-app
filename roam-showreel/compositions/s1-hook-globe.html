        <path d="M -60,185 C 150,210 285,290 220,410 C 155,530 325,650 230,830 C 155,970 265,1050 20,1110" />
        <path d="M -60,250 C 180,275 330,360 265,480 C 200,600 370,720 275,900" />

        <path d="M 1570,-90 C 1700,-150 1940,-95 2015,40 C 2080,180 2020,380 1890,480 C 1750,570 1520,500 1460,340 C 1410,200 1470,10 1570,-90 Z" />

  <script>
    (function () {
      const canvas = document.getElementById('s1-globe-canvas');
      const ctx = canvas.getContext('2d');
      const texImg = document.getElementById('s1-earth-tex');
      const R = 216;
      const CX = 240;
      const CY = 240;

      let texCanvas = null;
      let texCtx = null;
      let texPixels = null;
      let texW = 0;
      let texH = 0;
      const outImg = ctx.createImageData(480, 480);

      function ensureTex() {
        if (texPixels) return true;
        if (!texImg || !texImg.complete || texImg.naturalWidth === 0) return false;
        texW = 512;
        texH = 256;
        texCanvas = document.createElement('canvas');
        texCanvas.width = texW;
        texCanvas.height = texH;
        texCtx = texCanvas.getContext('2d');
        texCtx.drawImage(texImg, 0, 0, texW, texH);
        texPixels = texCtx.getImageData(0, 0, texW, texH).data;
        return true;
      }

      const globeState = { rot: 1.95 }; // starts near East Asia / Pacific

      function renderGlobe() {
        const hasTex = ensureTex();
        const data = outImg.data;
        data.fill(0);
        const rot = globeState.rot;
        const tilt = 0.24; // subtle axial tilt
        const cosTilt = Math.cos(tilt);
        const sinTilt = Math.sin(tilt);
        const invR = 1 / R;

        // Light vector from upper-left front
        const lx = -0.48, ly = -0.45, lz = 0.75;

        for (let py = 0; py < 480; py++) {
          const ny = (py - CY) * invR;
          const ny2 = ny * ny;
          if (ny2 >= 1) continue;
          const maxX = Math.sqrt(1 - ny2);
          const xStart = Math.max(0, Math.floor(CX - maxX * R));
          const xEnd = Math.min(479, Math.ceil(CX + maxX * R));

          for (let px = xStart; px <= xEnd; px++) {
            const nx = (px - CX) * invR;
            const r2 = nx * nx + ny2;
            if (r2 >= 1) continue;
            const nz = Math.sqrt(1 - r2);

            // Axial tilt around X
            const ty = ny * cosTilt - nz * sinTilt;
            const tz = ny * sinTilt + nz * cosTilt;
            const tx = nx;

            // Spherical UV
            const lon = Math.atan2(tx, tz) + rot;
            const lat = Math.asin(Math.max(-1, Math.min(1, ty)));
            let u = (lon / (2 * Math.PI)) % 1;
            if (u < 0) u += 1;
            const v = 0.5 + lat / Math.PI;

            let r = 38, g = 104, b = 166;
            if (hasTex) {
              const sx = Math.min(texW - 1, Math.floor(u * texW));
              const sy = Math.min(texH - 1, Math.floor(v * texH));
              const si = (sy * texW + sx) * 4;
              r = texPixels[si];
              g = texPixels[si + 1];
              b = texPixels[si + 2];
              // Lift deep navy oceans into vivid daylight sapphire
              if (b > r + 14 && b > g + 8 && b < 110) {
                r = Math.min(255, Math.round(r * 1.45 + 16));
                g = Math.min(255, Math.round(g * 1.85 + 48));
                b = Math.min(255, Math.round(b * 1.75 + 78));
              } else {
                r = Math.min(255, Math.round(r * 1.12 + 8));
                g = Math.min(255, Math.round(g * 1.12 + 8));
                b = Math.min(255, Math.round(b * 1.06 + 6));
              }
            }

            // Diffuse lighting + soft ambient + fresnel rim
            const ndotl = Math.max(0, nx * lx + ny * ly + nz * lz);
            const shade = 0.42 + 0.68 * ndotl;
            const fresnel = Math.pow(1 - nz, 3.2) * 0.48;

            const idx = (py * 480 + px) * 4;
            data[idx] = Math.min(255, Math.round(r * shade + 125 * fresnel));
            data[idx + 1] = Math.min(255, Math.round(g * shade + 195 * fresnel));
            data[idx + 2] = Math.min(255, Math.round(b * shade + 245 * fresnel));

            // Anti-aliased limb alpha
            const distPx = Math.sqrt(r2) * R;
            const alpha = distPx > R - 1.4 ? Math.max(0, Math.min(255, Math.round((R - distPx) / 1.4 * 255))) : 255;
            data[idx + 3] = alpha;
          }
        }
        ctx.putImageData(outImg, 0, 0);
      }

      if (texImg) {
        texImg.addEventListener('load', renderGlobe);
      }
      renderGlobe();

      const tl = gsap.timeline({ paused: true });

      // Gentle ambient drift on topo contours
      tl.fromTo('#s1-topo-group', { x: 0, y: 0 }, { x: -24, y: -12, duration: 5.5, ease: 'none' }, 0);

      // BEAT 1 (0.00 - 1.65s): Frame 0 crisp hook
      tl.fromTo('#s1-hook-line1', { opacity: 1, x: 0 }, { opacity: 1, x: 0, duration: 0.01 }, 0);
      tl.fromTo(
        '#s1-hook-word',
        { opacity: 0.15, x: 70, filter: 'blur(9px)' },
        { opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.36, ease: 'expo.out' },
        0.02
      );
      tl.fromTo('#s1-hook-underline', { scaleX: 0 }, { scaleX: 1, duration: 0.38, ease: 'power3.out' }, 0.20);
      tl.fromTo(
        '.s1-hook-wrap',
        { opacity: 1, x: 0, filter: 'blur(0px)' },
        { opacity: 0, x: -90, filter: 'blur(8px)', duration: 0.22, ease: 'power3.in', immediateRender: false },
        1.42
      );

      // BEAT 2 (1.64 - 3.26s): Chaos question + floating tab pills (1.42s readable hold!)
      tl.fromTo('#s1-chaos-wrap', { opacity: 0 }, { opacity: 1, duration: 0.06 }, 1.64);
      tl.fromTo(
        '#s1-chaos-l1',
        { opacity: 0, y: 24, filter: 'blur(8px)' },
        { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.28, ease: 'power4.out' },
        1.64
      );
      tl.fromTo(
        '#s1-chaos-l2',
        { opacity: 0, y: 24, filter: 'blur(8px)' },
        { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.28, ease: 'power4.out' },
        1.72
      );
      tl.fromTo('#s1-chip-1', { opacity: 0, scale: 0.7, y: 40, rotation: -6 }, { opacity: 1, scale: 1, y: 0, rotation: -5, duration: 0.36, ease: 'back.out(1.4)' }, 1.78);
      tl.fromTo('#s1-chip-2', { opacity: 0, scale: 0.7, y: 40, rotation: 5 }, { opacity: 1, scale: 1, y: 0, rotation: 4, duration: 0.36, ease: 'back.out(1.4)' }, 1.85);
      tl.fromTo('#s1-chip-3', { opacity: 0, scale: 0.7, y: -30, rotation: 4 }, { opacity: 1, scale: 1, y: 0, rotation: 3, duration: 0.36, ease: 'back.out(1.4)' }, 1.92);
      tl.fromTo('#s1-chip-4', { opacity: 0, scale: 0.7, y: -30, rotation: -5 }, { opacity: 1, scale: 1, y: 0, rotation: -4, duration: 0.36, ease: 'back.out(1.4)' }, 1.99);

      // Exit chaos beat cleanly at 3.12s -> 3.28s
      tl.fromTo('#s1-chaos-wrap', { opacity: 1, scale: 1, filter: 'blur(0px)' }, { opacity: 0, scale: 0.92, filter: 'blur(8px)', duration: 0.20, ease: 'power3.in', immediateRender: false }, 3.12);
      tl.fromTo('#s1-chip-1', { opacity: 1, x: 0, y: 0 }, { opacity: 0, x: -160, y: -90, duration: 0.20, ease: 'power3.in', immediateRender: false }, 3.12);
      tl.fromTo('#s1-chip-2', { opacity: 1, x: 0, y: 0 }, { opacity: 0, x: 160, y: -90, duration: 0.20, ease: 'power3.in', immediateRender: false }, 3.12);
      tl.fromTo('#s1-chip-3', { opacity: 1, x: 0, y: 0 }, { opacity: 0, x: -160, y: 90, duration: 0.20, ease: 'power3.in', immediateRender: false }, 3.12);
      tl.fromTo('#s1-chip-4', { opacity: 1, x: 0, y: 0 }, { opacity: 0, x: 160, y: 90, duration: 0.20, ease: 'power3.in', immediateRender: false }, 3.12);

      // BEAT 3 (3.28 - 5.50s): Title + Spinning 3D Earth -> Center Yellow Sun Match Cut
      tl.fromTo('#s1-globe-title', { opacity: 0 }, { opacity: 1, duration: 0.05 }, 3.28);
      tl.fromTo('#s1-gt-1', { opacity: 0, x: -48, filter: 'blur(8px)' }, { opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.36, ease: 'power4.out' }, 3.30);
      tl.fromTo('#s1-gt-2', { opacity: 0, x: -48, filter: 'blur(8px)' }, { opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.36, ease: 'power4.out' }, 3.40);

      tl.fromTo(
        '#s1-globe-holder',
        { opacity: 0, scale: 0.45, x: 0, y: 0 },
        { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.50, ease: 'back.out(1.4)' },
        3.30
      );

      // Single continuous deterministic globe rotation
      tl.fromTo(
        globeState,
        { rot: 1.95 },
        { rot: 8.60, duration: 2.15, ease: 'power1.in', onUpdate: renderGlobe },
        3.30
      );

      // Title exits while globe moves cleanly to exact center (960, 540) and shrinks to 140px yellow sun
      tl.fromTo('#s1-globe-title', { opacity: 1, x: 0, filter: 'blur(0px)' }, { opacity: 0, x: -80, filter: 'blur(8px)', duration: 0.25, ease: 'power3.in', immediateRender: false }, 4.62);
      tl.fromTo('#s1-globe-shadow', { opacity: 1 }, { opacity: 0, duration: 0.25, ease: 'power2.out', immediateRender: false }, 4.75);
      tl.fromTo(
        '#s1-globe-holder',
        { x: 0, scale: 1 },
        { x: -380, scale: 1, duration: 0.48, ease: 'power2.inOut', immediateRender: false },
        4.68
      );
      tl.fromTo('#s1-globe-canvas', { scale: 1, opacity: 1 }, { scale: 0.324, opacity: 0, duration: 0.36, ease: 'power3.inOut', immediateRender: false }, 5.10);
      tl.fromTo('#s1-sun-morph', { opacity: 0, scale: 3.08 }, { opacity: 1, scale: 1, duration: 0.34, ease: 'power3.inOut' }, 5.12);

      window.__timelines = window.__timelines || {};
      window.__timelines['s1-hook-globe'] = tl;
    })();
  </script>
