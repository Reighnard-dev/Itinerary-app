<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5cd3c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Roam" />
    <meta name="description" content="Find iconic places and hidden gems. Turn your next somewhere into a beautifully organized, day-by-day adventure with Roam." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Roam" />
    <meta property="og:url" content="https://roam-itinerary.vercel.app/" />
    <meta property="og:title" content="Roam — Plan Your Travel Itinerary" />
    <meta property="og:description" content="Find iconic places and hidden gems. Build your day-by-day adventure on iOS, Android, Huawei, and the web." />
    <meta property="og:image" content="https://roam-itinerary.vercel.app/og-logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Roam — Plan Your Travel Itinerary" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Roam — Plan Your Travel Itinerary" />
    <meta name="twitter:description" content="Find iconic places and hidden gems. Build your day-by-day adventure on iOS, Android, Huawei, and the web." />
    <meta name="twitter:image" content="https://roam-itinerary.vercel.app/og-logo.png" />
    <title>Roam — Plan Your Travel Itinerary</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/manrope-variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/dmsans-variable.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 100 1000; font-display: swap; src: url('/fonts/dmsans-variable.ttf') format('truetype'); }
      @font-face { font-family: Manrope; font-style: normal; font-weight: 200 800; font-display: swap; src: url('/fonts/manrope-variable.ttf') format('truetype'); }

      html, body { margin: 0; background: #faf5ea; }
      .launch-splash {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        pointer-events: none;
        background: radial-gradient(ellipse at center, #fcf8ef, #f7f0e4);
        color: #262923;
        will-change: opacity;
      }
      .launch-splash-copy { z-index: 1; display: grid; justify-items: center; padding-inline: 24px; text-align: center; transform: translateY(-2.5vh); }
      .launch-splash-brand { display: flex; align-items: center; gap: 0.14em; font: 800 clamp(2.75rem, 14vw, 4.5rem)/1 Manrope, sans-serif; letter-spacing: -0.07em; }
      .launch-splash-icon { display: grid; place-items: center; width: 1.24em; height: 1.24em; border-radius: 50%; background: #f5cf43; }
      .launch-splash-icon svg { width: 72%; height: 72%; }
      .launch-splash-dot { color: #dab128; }
      .launch-splash-copy p { margin: 1.5em 0 0; color: #60604d; font: 700 clamp(0.75rem, 3.45vw, 0.95rem)/1.65 'DM Sans', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; }
      .launch-splash-definitions { position: absolute; }
      .launch-splash-contours { position: absolute; width: clamp(140px, 48vw, 360px); color: #b48a50; opacity: 0.23; }
      .launch-splash-contours.top { top: 0; right: 0; }
      .launch-splash-contours.bottom { bottom: 0; left: 0; transform: rotate(180deg); }
      .launch-error { margin: 20vh 24px 0; text-align: center; color: #262923; font: 500 1rem/1.5 'DM Sans', sans-serif; }

      body:has(:focus-visible) .launch-splash { display: none; }
      @media (prefers-reduced-motion: reduce) { .launch-splash { display: none; } }
    </style>
  </head>
  <body>
    <div id="launch-splash" class="launch-splash" aria-hidden="true">
      <svg class="launch-splash-definitions" width="0" height="0">
        <defs>
          <g id="launch-contours">
            <path d="M9-10C24 22 68 32 68 66S52 117 97 130s70 14 87 51 42 40 68 45" />
            <path d="M37-10C52 16 92 23 93 56s-16 48 23 61 62 12 77 45 35 41 59 45" />
            <path d="M68-10C84 7 120 13 120 47s-13 46 21 53 57 8 70 39 26 36 41 40" />
            <path d="M107-10C131 0 151 14 148 40s15 43 44 43 38 20 45 43 11 20 15 24" />
            <path d="M143-10C164 0 174 15 173 36s18 29 39 23 31-5 40 5" />
          </g>
        </defs>
      </svg>
      <svg class="launch-splash-contours top" viewBox="0 0 240 225" fill="none" stroke="currentColor" stroke-width="1.25"><use href="#launch-contours" /></svg>
      <svg class="launch-splash-contours bottom" viewBox="0 0 240 225" fill="none" stroke="currentColor" stroke-width="1.25"><use href="#launch-contours" /></svg>
      <div class="launch-splash-copy">
        <div class="launch-splash-brand">
          <span class="launch-splash-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z" />
            </svg>
          </span>
          <span>roam<span class="launch-splash-dot">.</span></span>
        </div>
        <p>For the wanderers.<br />And the wonderers.</p>
      </div>
    </div>
    <script>performance.mark('roam-splash-shown');</script>
    <div id="root"></div>
    <p id="launch-error" class="launch-error" hidden>Roam couldn’t load. <a href="">Reload Roam</a></p>
    <noscript><style>.launch-splash { display: none; }</style><p class="launch-error">Enable JavaScript to open Roam.</p></noscript>
    <script type="module" src="/src/launch.ts"></script>
  </body>
</html>
